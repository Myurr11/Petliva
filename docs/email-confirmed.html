<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Email confirmed — Bowlkeeper</title>
<style>
  @font-face { font-family: system-ui; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #FCF9F8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  .card {
    max-width: 380px;
    width: 100%;
    background: #FFFFFF;
    border: 3px solid #1C1B1B;
    border-radius: 28px;
    padding: 36px 28px;
    text-align: center;
    box-shadow: 6px 6px 0 #1C1B1B;
  }
  .icon {
    width: 84px;
    height: 84px;
    border-radius: 20px;
    border: 3px solid #1C1B1B;
    margin: 0 auto 20px;
    display: block;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 56px;
    height: 56px;
    border-radius: 999px;
    background: #DCEEDF;
    border: 3px solid #1C1B1B;
    margin-bottom: 18px;
    font-size: 28px;
  }
  h1 {
    font-size: 22px;
    color: #1C1B1B;
    margin: 0 0 10px;
  }
  p {
    font-size: 15px;
    color: #4F4632;
    line-height: 1.5;
    margin: 0 0 26px;
  }
  .btn {
    display: inline-block;
    width: 100%;
    padding: 14px 20px;
    background: #FFC107;
    color: #1C1B1B;
    text-decoration: none;
    font-weight: 700;
    font-size: 15px;
    border: 3px solid #1C1B1B;
    border-radius: 999px;
    box-shadow: 4px 4px 0 #1C1B1B;
  }
  .hint {
    margin-top: 18px;
    font-size: 12.5px;
    color: #4F4632;
    opacity: 0.8;
  }
</style>
</head>
<body>
  <div class="card">
    <img class="icon" src="./app-icon-source.png" alt="Bowlkeeper" onerror="this.style.display='none'" />
    <div class="badge">✓</div>
    <h1>Email confirmed!</h1>
    <p>Your Bowlkeeper account is verified. You can close this tab and log in from the app.</p>
    <a class="btn" href="bowlkeeper://sign-in">Open Petliva</a>
    <div class="hint">If tapping the button does nothing (common on iOS Mail / in Expo Go), just switch back to the app manually and log in.</div>
  </div>
</body>
</html>
